<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .title { font-size: 1.2em; font-weight: bold; }
        .status-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; }
        .healthy { background-color: #2ecc71; }
        .unhealthy { background-color: #e74c3c; }
        .details { font-size: 0.9em; color: #666; margin-bottom: 15px; }
        .actions { display: flex; gap: 10px; }
        button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; transition: background 0.3s; }
        .btn-toggle { background-color: #3498db; color: white; }
        .btn-toggle.off { background-color: #95a5a6; }
        .btn-test { background-color: #f1c40f; color: #333; }
        .metrics { margin-top: 10px; font-size: 0.85em; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 10px; }
        
        /* Modal */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        pre { background: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .close { float: right; cursor: pointer; font-size: 1.5em; margin-top: -10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Argus Control Center 👁️</h1>
        <div class="grid">
            {% for plugin in plugins %}
            <div class="card" id="card-{{ plugin.name }}">
                <div class="header">
                    <span class="title">{{ plugin.name }}</span>
                    <span class="status-dot {% if plugin.health.is_healthy %}healthy{% else %}unhealthy{% endif %}"></span>
                </div>
                <div class="details">{{ plugin.description }}</div>
                <div class="actions">
                    <button class="btn-toggle {% if not plugin.is_active %}off{% endif %}" onclick="togglePlugin('{{ plugin.name }}')">
                        {% if plugin.is_active %}ON{% else %}OFF{% endif %}
                    </button>
                    <button class="btn-test" onclick="dryRun('{{ plugin.name }}')">Test Fetch</button>
                </div>
                <div class="metrics">
                    <div>Latency: {{ "%.2f"|format(plugin.health.latency_ms) }} ms</div>
                    <div>Last Success: {{ plugin.health.last_success_time or 'Never' }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>Dry Run Result</h3>
            <pre id="modal-output">Loading...</pre>
        </div>
    </div>


    <script>
        async function togglePlugin(name) {
            try {
                const response = await fetch(`/api/plugins/${name}/toggle`, { method: 'POST' });
                const result = await response.json();
                if (result.status === 'success') {
                    location.reload(); // Simple reload to update UI
                } else {
                    alert('Error toggling plugin');
                }
            } catch (e) {
                console.error(e);
                alert('Request failed');
            }
        }

        async function dryRun(name) {
            const modal = document.getElementById('modal');
            const output = document.getElementById('modal-output');
            modal.style.display = 'flex';
            output.textContent = 'Fetching...';

            try {
                const response = await fetch(`/api/plugins/${name}/dry_run`);
                const result = await response.json();
                output.textContent = JSON.stringify(result.data, null, 2);
            } catch (e) {
                output.textContent = 'Error: ' + e.message;
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target == document.getElementById('modal')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
